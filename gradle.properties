android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.emitKotlinMetadata=false -Dcom.android.tools.r8.disableKotlinMetadataVerification=true -Dcom.android.tools.r8.experimental.enableKotlinMetadataDesugaring=false
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Compile Kotlin inside the Gradle daemon instead of a second JVM. The separate Kotlin daemon
# peaked at 4.4 GB RSS on this project, so build + emulator + a trace analysis could not fit in
# 16 GB. This is the one-JVM configuration and it is what makes the two coexist.
kotlin.compiler.execution.strategy=in-process
# The heap and the missing kotlin.daemon.jvmargs follow Komikku upstream: the Kotlin compile
# daemon inherits the Gradle daemon's heap, so the build runs in ONE JVM instead of two. The
# previous pair (-Xmx6g plus a separate -Xmx4g -Xms1g) reserved 10 GB before the emulator and
# any trace analysis, which is enough to OOM a 16 GB machine. The R8 flags are NOT upstream's:
# they are required by this fork's pinned R8 9.1.29 (Kotlin 2.4 requires D8/R8 9.1.29+) and
# must stay for the release build.
#
# The heap stays at Komikku's 4g. The fidelity loop is slow because the app module is 1589 Kotlin
# files compiled as one unit, and that compile is 336s of a 380s build; the fix is to keep the
# renderer out of the app module, not to give the compiler more memory.
